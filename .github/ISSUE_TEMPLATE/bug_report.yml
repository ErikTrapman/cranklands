name: Report a bug
description: Something in Cranklands is broken or doesn't do what it says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Everything here is public, so please leave out personal details (email, Strava links).
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Settings › About shows it, under "Version".
      placeholder: "0.5.4"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or tablet, and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: input
    id: trainer
    attributes:
      label: Trainer and sensors
      description: Make and model of the trainer, and any heart-rate strap or other sensor you had paired.
      placeholder: "Wahoo KICKR Core, Garmin HRM-Dual"
  - type: dropdown
    id: area
    attributes:
      label: Where in the app
      options:
        - Pairing a trainer or sensor
        - During a ride
        - Workouts, builder or plan
        - Courses
        - History, progress or the ride summary
        - Strava
        - Settings
        - Something else
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps, as exact as you can. Does it happen every time?
      placeholder: |
        1. Pick "Sweet Spot 3x10"
        2. Start in ERG
        3. At the second interval…
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Drag images or a video in here if you have them.
